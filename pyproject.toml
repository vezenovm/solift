[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "solift"
version = "0.0.0"
description = "Extracts an integer model from a Solidity function, links it to the bytecode with Halmos, and proves theorems on it with SMT solvers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "cvc5==1.4.2",
  "halmos==0.3.3",
  "yices-solver==2.6.4.post23",
  "z3-solver==4.12.6.0",
]

[project.scripts]
solift = "solift.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "lib"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
